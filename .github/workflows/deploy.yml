name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, testing ]
  pull_request:
    branches: [ main, master, testing ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  lint-and-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Configure SSH for Private Repositories
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure GOPRIVATE & Git for Private Repos
        run: |
          echo "GOPRIVATE=github.com/Golden-Rama-Digital,github.com/Golden-Rama-Vendor" >> $GITHUB_ENV
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Verify Go Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly. Please run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

  build-and-test:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-scan
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Configure SSH for Private Repositories
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure GOPRIVATE & Git for Private Repos
        run: |
          echo "GOPRIVATE=github.com/Golden-Rama-Digital,github.com/Golden-Rama-Vendor" >> $GITHUB_ENV
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Download Dependencies
        run: go mod download

      - name: Compile Application
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o main .

  deploy-docker:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/testing')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure SSH for Docker Builder
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Determine Docker Tag
        run: |
          if [ "${{ github.ref_name }}" = "testing" ]; then
            echo "DOCKER_TAG=testing" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          fi
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.DOCKER_TAG }}
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          ssh: |
            default=${{ env.SSH_AUTH_SOCK }}

  deploy-to-staging:
    name: Deploy to Staging via VPN
    runs-on: ubuntu-latest
    needs: deploy-docker
    environment: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn openvpn-systemd-resolved

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_CONFIG }}" > client.ovpn
          if [ -n "${{ secrets.VPN_USER }}" ] && [ -n "${{ secrets.VPN_PASSWORD }}" ]; then
            echo -e "${{ secrets.VPN_USER }}\n${{ secrets.VPN_PASSWORD }}" > auth.txt
            sed -i 's/auth-user-pass/auth-user-pass auth.txt/g' client.ovpn || echo "auth-user-pass auth.txt" >> client.ovpn
          fi
          sudo openvpn --config client.ovpn --daemon
          echo "Waiting for VPN connection to establish..."
          for i in {1..15}; do
            if ip a show dev tun0 &> /dev/null; then
              echo "VPN tunnel established successfully."
              break
            fi
            sleep 2
          done

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: SSH and Deploy Container to Staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_LOWER: ${{ env.REPO_LOWER }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REPO_LOWER
          script: |
            echo "Logging in to GitHub Container Registry..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            echo "Pulling latest testing image..."
            docker pull ghcr.io/$REPO_LOWER:testing
            
            echo "Stopping existing testing container..."
            docker stop flight-service-ma-testing || true
            docker rm flight-service-ma-testing || true
            
            # Detect host private DNS (e.g. 10.10.0.2) to resolve private RDS hostname correctly
            DNS_ARGS=""
            if [ -f /run/systemd/resolve/resolv.conf ]; then
              # Find private IP nameservers first (10.x.x.x, 172.16-31.x.x, 192.168.x.x)
              PRIVATE_DNS=$(grep -oE '^nameserver [0-9.]+' /run/systemd/resolve/resolv.conf | awk '{print $2}' | grep -E '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)')
              for dns in $PRIVATE_DNS; do
                DNS_ARGS="$DNS_ARGS --dns $dns"
              done
              echo "Detected private DNS: $PRIVATE_DNS"
              
              if [ -z "$DNS_ARGS" ]; then
                DNS_IP=$(grep -oE '^nameserver [0-9.]+' /run/systemd/resolve/resolv.conf | head -n 1 | awk '{print $2}')
                if [ -n "$DNS_IP" ] && [ "$DNS_IP" != "127.0.0.53" ]; then
                  DNS_ARGS="--dns $DNS_IP"
                  echo "Fallback to host DNS: $DNS_IP"
                fi
              fi
            fi

            echo "Starting new testing container on port 4000..."
            docker run -d \
              $DNS_ARGS \
              -p 4000:4001 \
              -v /opt/secrets/flight_ma_secrets:/run/secrets/flight_secrets \
              --name flight-service-ma-testing \
              --restart unless-stopped \
              ghcr.io/$REPO_LOWER:testing
            
            echo "Staging deployment successful!"

      - name: Kill VPN Connection
        if: always()
        run: sudo killall openvpn || true

  deploy-to-production:
    name: Deploy to Production via VPN
    runs-on: ubuntu-latest
    needs: deploy-docker
    environment: production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn openvpn-systemd-resolved

      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_CONFIG }}" > client.ovpn
          if [ -n "${{ secrets.VPN_USER }}" ] && [ -n "${{ secrets.VPN_PASSWORD }}" ]; then
            echo -e "${{ secrets.VPN_USER }}\n${{ secrets.VPN_PASSWORD }}" > auth.txt
            sed -i 's/auth-user-pass/auth-user-pass auth.txt/g' client.ovpn || echo "auth-user-pass auth.txt" >> client.ovpn
          fi
          sudo openvpn --config client.ovpn --daemon
          echo "Waiting for VPN connection to establish..."
          for i in {1..15}; do
            if ip a show dev tun0 &> /dev/null; then
              echo "VPN tunnel established successfully."
              break
            fi
            sleep 2
          done

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: SSH and Deploy Container to Production
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_LOWER: ${{ env.REPO_LOWER }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REPO_LOWER
          script: |
            echo "Logging in to GitHub Container Registry..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            echo "Pulling latest production image..."
            docker pull ghcr.io/$REPO_LOWER:latest
            
            echo "Stopping existing production container..."
            docker stop flight-service-ma-production || true
            docker rm flight-service-ma-production || true
            
            # Detect host private DNS (e.g. 10.10.0.2) to resolve private RDS hostname correctly
            DNS_ARGS=""
            if [ -f /run/systemd/resolve/resolv.conf ]; then
              # Find private IP nameservers first (10.x.x.x, 172.16-31.x.x, 192.168.x.x)
              PRIVATE_DNS=$(grep -oE '^nameserver [0-9.]+' /run/systemd/resolve/resolv.conf | awk '{print $2}' | grep -E '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)')
              for dns in $PRIVATE_DNS; do
                DNS_ARGS="$DNS_ARGS --dns $dns"
              done
              echo "Detected private DNS: $PRIVATE_DNS"
              
              if [ -z "$DNS_ARGS" ]; then
                DNS_IP=$(grep -oE '^nameserver [0-9.]+' /run/systemd/resolve/resolv.conf | head -n 1 | awk '{print $2}')
                if [ -n "$DNS_IP" ] && [ "$DNS_IP" != "127.0.0.53" ]; then
                  DNS_ARGS="--dns $DNS_IP"
                  echo "Fallback to host DNS: $DNS_IP"
                fi
              fi
            fi

            echo "Starting new production container on port 4001..."
            docker run -d \
              $DNS_ARGS \
              -p 4001:4001 \
              -v /opt/secrets/flight_ma_secrets_production:/run/secrets/flight_secrets \
              --name flight-service-ma-production \
              --restart unless-stopped \
              ghcr.io/$REPO_LOWER:latest
            
            echo "Production deployment successful!"

      - name: Kill VPN Connection
        if: always()
        run: sudo killall openvpn || true
